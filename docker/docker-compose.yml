networks:
    redis-cluster:
        name: redis-cluster
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: "172.63.0.0/16"

services:
    nginx:
        container_name: ddd-nginx
        depends_on:
            - ddd-laravel
        build:
            context: ./ # Đường dẫn tới thư mục chứa Dockerfile
            dockerfile: nginx/Dockerfile
        restart: always
        networks:
            redis-cluster:
                ipv4_address: 172.63.0.21
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ../repo:/var/www/html/repo
#            - ./ssl:/etc/nginx/ssl

    ddd-laravel:
        build:
            context: ./
            dockerfile: php/Dockerfile
        container_name: ddd-laravel
        networks:
            redis-cluster:
                ipv4_address: 172.63.0.22
        restart: unless-stopped
        working_dir: /var/www/html/repo
        volumes:
            - ../repo:/var/www/html/repo
            - ./xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        expose:
            - 9000
            - 9003
        environment:
            PHP_IDE_CONFIG: "serverName=ddd-laravel.local"
